name: Release

# Tag-driven release. Safe to merge before any secrets exist:
#
#   * With no CF_API_TOKEN configured, this builds the package, attaches it to
#     the GitHub Release, and SKIPS the CurseForge upload. Nothing fails.
#   * Once the maintainer adds CF_API_TOKEN (and optionally WOWI/WAGO tokens)
#     in Settings > Secrets and variables > Actions, the same workflow starts
#     publishing with no edits required.
#
# Before the first real release, also add the CurseForge project id to the core
# TOC files as "## X-Curse-Project-ID: <id>" so uploads land on the right page.
#
# Tag naming drives the version stamped into every TOC via @project-version@,
# e.g. `git tag -a v468-ce7.6 -m "v468-ce7.6" && git push origin v468-ce7.6`.
# Prefer an annotated tag to record release authorship and a message.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build only, never upload'
        type: boolean
        default: true

permissions:
  contents: write  # required to create the GitHub Release

jobs:
  release:
    name: Package and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Re-run the same structural checks as CI. A tag can point at a commit
      # that never went through a pull request, so do not assume it was gated.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate addon manifests
        run: python tools/validate_addon.py --github

      # Decide whether this run is allowed to upload. Secrets are not available
      # to workflows triggered from forks, and may simply not be configured yet.
      - name: Determine release mode
        id: mode
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "${DRY_RUN}" = "true" ]; then
            echo "args=-d" >> "$GITHUB_OUTPUT"
            echo "::notice::Manual dry run - building only, no upload."
          elif [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            echo "::error::Publishing requires a tag. Select a release tag for a manual run, or enable dry_run."
            exit 1
          elif [ -z "${CF_API_TOKEN}" ]; then
            # Disable third-party destinations, not GitHub (-d skips ALL uploads).
            echo "args=-p 0 -w 0 -a 0" >> "$GITHUB_OUTPUT"
            echo "::notice::No CF_API_TOKEN configured - building and attaching to the GitHub Release only."
          else
            if ! grep -Eq '^## X-Curse-Project-ID:[[:blank:]]*[1-9][0-9]*[[:space:]]*$' NeatPlates/NeatPlates.toc; then
              echo "::error file=NeatPlates/NeatPlates.toc::CF_API_TOKEN is configured, but the tagged core manifest has no valid X-Curse-Project-ID. Merge the project metadata before tagging."
              exit 1
            fi
            echo "args=" >> "$GITHUB_OUTPUT"
            echo "::notice::Publishing to configured distribution channels."
          fi

      - name: Build and release
        uses: BigWigsMods/packager@v2
        with:
          args: ${{ steps.mode.outputs.args }}
        env:
          # The packager expects GITHUB_API_TOKEN, not GH_API_TOKEN.
          # Non-dry runs attach the ZIP even without third-party credentials.
          GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          WOWI_API_TOKEN: ${{ secrets.WOWI_API_TOKEN }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}

      # Keep the distribution ZIP for publishing; unwrap only the Actions artifact.
      - name: Prepare install-ready artifact
        run: python tools/prepare_artifact.py "${{ runner.temp }}/neatplates-artifact"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: neatplates-release
          path: ${{ runner.temp }}/neatplates-artifact/
          if-no-files-found: error
          retention-days: 90
